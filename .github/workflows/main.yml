name: CI

on:
  push:
    branches: [main, development, release]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получение файлов проекта
        uses: actions/checkout@v6

      - name: Настройка Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Запуск теста
        run: node test.js