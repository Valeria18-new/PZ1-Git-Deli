name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "version.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Получение файлов проекта
        uses: actions/checkout@v6

      - name: Формирование документации
        run: |
          mkdir -p generated-docs
          echo "Документация проекта" > generated-docs/documentation.txt
          echo "" >> generated-docs/documentation.txt
          cat version.txt >> generated-docs/documentation.txt
          echo "" >> generated-docs/documentation.txt
          cat README.md >> generated-docs/documentation.txt

      - name: Сохранение документации
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: generated-docs/documentation.txt
        